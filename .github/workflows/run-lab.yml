name: Run Lab CPU Experiment

on:
  workflow_dispatch:
    inputs:
      lab_slug:
        description: "Lab slug (used for commit message and legacy labs/<slug> fallback)"
        required: true
        type: string
      lab_dir:
        description: "Directory containing lab files ('.' for dedicated repo root, or 'labs/<slug>')"
        required: false
        default: "."
        type: string

permissions:
  contents: write

jobs:
  run-cpu-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dedicated public lab repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Validate lab inputs
        run: |
          if ! [[ "${{ inputs.lab_slug }}" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid lab_slug"
            exit 1
          fi
          TARGET_DIR="${{ inputs.lab_dir }}"
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          if [ "$TARGET_DIR" != "." ] && ! [[ "$TARGET_DIR" =~ ^labs/[a-z0-9-]+$ ]]; then
            echo "Invalid lab_dir: $TARGET_DIR"
            exit 1
          fi
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      - name: Install lab dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "$TARGET_DIR/requirements.txt" ]; then
            pip install -r "$TARGET_DIR/requirements.txt"
          fi
          pip install pytest nbformat nbclient ipykernel

      - name: Run experiment, notebook, and pytest suite
        run: |
          cd "$TARGET_DIR"
          set -o pipefail
          python run_experiment.py 2>&1 | tee run_output.log
          echo "" | tee -a run_output.log
          echo "=== Executing notebook.ipynb ===" | tee -a run_output.log
          if [ -f "notebook.ipynb" ]; then
            python -c "import nbformat; from nbclient import NotebookClient; nb = nbformat.read('notebook.ipynb', as_version=4); NotebookClient(nb, timeout=180, kernel_name='python3').execute(); print('Notebook executed cleanly:', len(nb.cells), 'cells')" 2>&1 | tee -a run_output.log
          fi
          echo "" | tee -a run_output.log
          echo "=== Running pytest suite ===" | tee -a run_output.log
          if [ -d "tests" ]; then
            pytest -v tests/ 2>&1 | tee -a run_output.log
          fi

      - name: Commit metrics, environment, and run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in metrics.json environment.json run_output.log; do
            if [ -f "$TARGET_DIR/$f" ]; then
              git add "$TARGET_DIR/$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(lab): record CPU Actions run for ${{ inputs.lab_slug }}"
            git push
          fi
